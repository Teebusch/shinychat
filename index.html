<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shinychat</title>
</head>
<body class="flex h-screen w-screen">
  <script type="module" src="/src/main.ts"></script>

    <!-- Sidebar with user list -->
    <aside class="bg-base-200 p-4 w-16 lg:w-1/4">
      <h3 class="text-lg mb-4 hidden lg:block">
        Active Users
        <span x-data x-text="$store.users.users.length" class="badge badge-primary badge-sm ml-2"></span>
      </h3>
      <ul x-data class="flex flex-col gap-2">

        <!-- self -->
        <li x-data class="flex flex-row gap-2 items-center rouded-lg p-2 bg-base-300">
            <img class="w-10 rounded-sm" :src="'https://api.dicebear.com/9.x/bottts-neutral/svg?seed=' + $store.user.id"/>
          </div>
          <div class="hidden lg:block">
            <div x-text="$store.user.name" class="font-bold"></div>
            <div class="text-sm opacity-80">You</div>
          </div>
        </li>

        <!-- other users -->
        <template x-for="user in $store.users.users.filter(u => u.userId !== $store.user.id)" :key="user.id">
          <li x-data class="flex flex-row gap-2 items-center p-2">
              <img class="w-10 rounded-sm" :src="'https://api.dicebear.com/9.x/bottts-neutral/svg?seed=' + user.id"/>
            </div>
            <div class="hidden lg:block">
              <div x-text="user.name" class="font-bold"></div>
              <div x-text="'Last seen ' + formatTime(user.lastSeen)" class="text-sm opacity-80"></div>
            </div>
          </li>
        </template>
      </ul>
    </aside>

    <!-- chat window -->
    <main class="grow overflow-y-scroll bg-base-100 px-3 content-end ">
      <div class="max-w-2xl mx-auto">

        <!-- events and messages -->
        <div x-data class="flex flex-col px-4 py-2 gap-4">
          <template x-for="event in $store.room.history" :key="event.id">
            <div x-data="{
              isSelf: event.userId == $store.user.id,
              userName: $store.users.getUserById(event.userId).name
            }">

              <!-- event -->
              <template x-if="event.type === 'user-joined' || event.type === 'user-left'">
                <div class="text-left text-sm opacity-80 py-2">
                  <span class="opacity-50" x-text="formatTime(event.timestamp)"></span>
                  <span x-text="isSelf ? 'You' : userName"></span>
                  <span x-text="event.type == 'user-joined' ? 'joined the room' : 'left the room'"></span>
                </div>
              </template>
              
              <!-- message -->
              <template x-if="event.type == 'message'">
                <div class="chat" :class="isSelf ? 'chat-end' : 'chat-start'">
                  <div class="chat-image avatar">
                    <div class="w-12 rounded-sm">
                      <img :src="'https://api.dicebear.com/9.x/bottts-neutral/svg?seed=' + event.userId"/>
                    </div>
                  </div>
                  <div class="chat-bubble mx-2" :class="isSelf ? 'bg-base-200' : 'bg-primary text-primary-content'">
                    <div class="text-sm font-bold" x-text="isSelf ? 'You' : userName"></div>
                    <div x-text="event.message"></div>
                    <div class="text-end text-xs opacity-80">
                      <time x-text="formatTime(event.timestamp)"></time>
                    </div>
                  </div>
                </div>
              </template>
          
            </div>
          </template>
        </div>

        <!-- message input -->
        <div class="sticky bottom-0">
          <div class="h-10 bg-gradient-to-b from-transparent to-base-100"></div>
          <div class="shadow-sm bg-base-100">
            <textarea 
            x-data="{
              message: '',
              sendMessage() {
                if (this.message.trim() === '') return;
                $store.room.sendMessage(this.message);
                this.message = '';
              }
            }"
            :value="message"
            @input="message = $event.target.value"
            @keyup.enter="if ($event.shiftKey) return; sendMessage()"
            class="textarea m-0 w-full resize-none p-3 rounded-md" 
            placeholder="Message" 
            ></textarea>
          </div>
          <div class="h-4 bg-base-100"></div>
        </div>

      </div>

    </main>

</body>
</html>
